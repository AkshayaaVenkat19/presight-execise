services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/users.db}
    volumes:
      # Persist the SQLite database file between container restarts
      - db-data:/app/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://server:3001}
    ports:
      - "${CLIENT_PORT:-80}:80"
    networks:
      - app-network
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
